<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allocco S.A.</title>
  <meta name="description" content="Sitio en construcción. Contacto: info@allocco.com.ar">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230f172a'/><text x='8' y='12' font-size='10' text-anchor='middle' fill='%23f59e0b' font-family='sans-serif' font-weight='700'>A</text></svg>">
  <style>
    :root { --bg:#0f172a; --fg:#f8fafc; --muted:#94a3b8; --accent:#f59e0b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      background:var(--bg); color:var(--fg);
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display:flex; align-items:center; justify-content:center; text-align:center; padding:24px 16px;
    }
    main { max-width:560px; width:100%; }
    .wip { width:160px; height:160px; margin:0 auto 32px; display:block; }
    h1 { font-size:clamp(2rem, 6vw, 3rem); letter-spacing:.04em; font-weight:800; }
    p.sub { color:var(--muted); margin-top:12px; font-size:1.1rem; }
    a.mail {
      display:inline-block; margin-top:32px; padding:14px 28px; border-radius:999px;
      background:var(--accent); color:#0f172a; font-weight:700; text-decoration:none; font-size:1.05rem;
    }
    a.mail:hover { filter:brightness(1.08); }
    footer { margin-top:48px; color:var(--muted); font-size:.85rem; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes spin-rev { to { transform:rotate(-360deg); } }
    .gear-a { transform-origin:56px 56px; animation:spin 6s linear infinite; }
    .gear-b { transform-origin:110px 106px; animation:spin-rev 4.5s linear infinite; }
  </style>
</head>
<body>
  <main>
    <svg class="wip" viewBox="0 0 160 160" role="img" aria-label="Sitio en construcción">
      <g class="gear-a" fill="#f59e0b">
        <circle cx="56" cy="56" r="26" fill="none" stroke="#f59e0b" stroke-width="12"/>
        <g id="ta"><rect x="50" y="18" width="12" height="16" rx="2"/></g>
        <use href="#ta" transform="rotate(45 56 56)"/><use href="#ta" transform="rotate(90 56 56)"/>
        <use href="#ta" transform="rotate(135 56 56)"/><use href="#ta" transform="rotate(180 56 56)"/>
        <use href="#ta" transform="rotate(225 56 56)"/><use href="#ta" transform="rotate(270 56 56)"/>
        <use href="#ta" transform="rotate(315 56 56)"/>
      </g>
      <g class="gear-b" fill="#f8fafc">
        <circle cx="110" cy="106" r="18" fill="none" stroke="#f8fafc" stroke-width="10"/>
        <g id="tb"><rect x="105" y="76" width="10" height="13" rx="2"/></g>
        <use href="#tb" transform="rotate(60 110 106)"/><use href="#tb" transform="rotate(120 110 106)"/>
        <use href="#tb" transform="rotate(180 110 106)"/><use href="#tb" transform="rotate(240 110 106)"/>
        <use href="#tb" transform="rotate(300 110 106)"/>
      </g>
    </svg>
    <h1>ALLOCCO S.A.</h1>
    <p class="sub">Estamos trabajando en nuestro nuevo sitio web.</p>
    <a class="mail" href="mailto:info@allocco.com.ar">info@allocco.com.ar</a>
    <footer>© <span id="y"></span> Allocco S.A.</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>

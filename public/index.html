<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allocco S.A.</title>
  <meta name="description" content="Allocco S.A. Soluciones para la industria aceitera. Sitio en construcción. Contacto: allocco@allocco.com.ar">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <style>
    :root { --bg:#ffffff; --fg:#1f2937; --muted:#6b7280; --green:#0b6b3a; --yellow:#ffd100; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      background:var(--bg); color:var(--fg);
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display:flex; align-items:center; justify-content:center; text-align:center; padding:24px 16px;
    }
    main { max-width:560px; width:100%; }
    .logo { width:min(360px, 80vw); height:auto; display:block; margin:0 auto 12px; }
    .tagline { color:var(--green); font-weight:600; letter-spacing:.02em; font-size:1.05rem; }
    .wip { width:120px; height:120px; margin:40px auto 24px; display:block; }
    h1 { font-size:clamp(1.4rem, 4vw, 1.9rem); font-weight:700; color:var(--fg); }
    p.sub { color:var(--muted); margin-top:8px; font-size:1rem; }
    a.mail {
      display:inline-block; margin-top:28px; padding:14px 28px; border-radius:999px;
      background:var(--green); color:#fff; font-weight:700; text-decoration:none; font-size:1.05rem;
    }
    a.mail:hover { filter:brightness(1.1); }
    footer { margin-top:48px; color:var(--muted); font-size:.85rem; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes spin-rev { to { transform:rotate(-360deg); } }
    .gear-a { transform-origin:56px 56px; animation:spin 6s linear infinite; }
    .gear-b { transform-origin:110px 106px; animation:spin-rev 4.5s linear infinite; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="Allocco" width="896" height="210">
    <p class="tagline">Soluciones para la industria aceitera</p>
    <svg class="wip" viewBox="0 0 160 160" role="img" aria-label="Sitio en construcción">
      <g class="gear-a" fill="#0b6b3a">
        <circle cx="56" cy="56" r="26" fill="none" stroke="#0b6b3a" stroke-width="12"/>
        <g id="ta"><rect x="50" y="18" width="12" height="16" rx="2"/></g>
        <use href="#ta" transform="rotate(45 56 56)"/><use href="#ta" transform="rotate(90 56 56)"/>
        <use href="#ta" transform="rotate(135 56 56)"/><use href="#ta" transform="rotate(180 56 56)"/>
        <use href="#ta" transform="rotate(225 56 56)"/><use href="#ta" transform="rotate(270 56 56)"/>
        <use href="#ta" transform="rotate(315 56 56)"/>
      </g>
      <g class="gear-b" fill="#ffd100">
        <circle cx="110" cy="106" r="18" fill="none" stroke="#ffd100" stroke-width="10"/>
        <g id="tb"><rect x="105" y="76" width="10" height="13" rx="2"/></g>
        <use href="#tb" transform="rotate(60 110 106)"/><use href="#tb" transform="rotate(120 110 106)"/>
        <use href="#tb" transform="rotate(180 110 106)"/><use href="#tb" transform="rotate(240 110 106)"/>
        <use href="#tb" transform="rotate(300 110 106)"/>
      </g>
    </svg>
    <h1>Sitio en construcción</h1>
    <p class="sub">Estamos trabajando en nuestro nuevo sitio web. Mientras tanto, escribinos:</p>
    <a class="mail" href="mailto:allocco@allocco.com.ar">allocco@allocco.com.ar</a>
    <footer>© <span id="y"></span> Allocco S.A.</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
